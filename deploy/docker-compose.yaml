services:
    api:
        image: lendoo73/ml-api:gpu
        ports:
          - "8002:8000"
        working_dir: /app
        env_file:
          - sample.env
        environment:
          MODEL_WEIGHTS_DIR: /app/weights
        volumes:
          - ./log/:/app/log
          - ./config.json:/app/build/config.json
          - model_weights:/app/weights
        gpus: all
        command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
    model_weights: