services:
    api:
        image: lendoo73/ml-api:latest
        ports:
          - "8002:8000"
        working_dir: /app
        env_file:
          - sample.env
        volumes:
          - ./log/:/app/log
          - ./config.json:/app/build/config.json
        command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]